[cerebrium.deployment]
name = "mtailor-classifier"
python_version = "3.10"
include = ["./*"]
exclude = [".*", "./mtailer_mlops/*"]
shell_commands = [""]

[cerebrium.hardware]
cpu = 2.0
memory = 12.0
compute = "CPU"

[cerebrium.runtime.custom]
port = 8192
healthcheck_endpoint = "/health"
dockerfile_path = "./Dockerfile"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 5
cooldown = 30
replica_concurrency = 100